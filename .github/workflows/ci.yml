name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get install -y zsh zip unzip
      - name: Lint
        if: runner.os == 'Linux'
        run: shellcheck aliases.sh cti.sh tests/test.sh
      - name: Test
        run: bash tests/test.sh
